services:
  db:
    image: postgres:16-alpine
    container_name: borrowbooking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: borrowbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: borrowbooking-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/borrowbooking
    ports:
      - "3100:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: borrowbooking-frontend
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - backend

volumes:
  postgres_data:
